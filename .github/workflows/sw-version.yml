# Guard: an APP_SHELL asset change without a service-worker VERSION bump would
# leave installed clients on the stale shell forever. Also cross-checks that
# every asset referenced by an APP_SHELL page is itself in APP_SHELL (a miss
# breaks the app offline only — no ordinary test sees it).
name: sw-version

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: check service worker version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1
          else
            base="${{ github.event.before }}"
            # First push / forced history: fall back to the empty tree.
            git cat-file -e "$base" 2>/dev/null || base=$(git hash-object -t tree /dev/null)
          fi
          bash scripts/check-sw-version.sh "$base"
