# Two ecosystems: the workflow actions, and the Docker base images the
# server image is built FROM (golang:1.27-alpine, alpine:3.24). No npm block —
# the app has no build toolchain and no package.json.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    cooldown:
      default-days: 3
